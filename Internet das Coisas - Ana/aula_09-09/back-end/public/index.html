<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Comentários</title>
</head>
<body>

    <h1>Comentários</h1>

    <textarea
        id="comentario"
        placeholder="Digite seu comentário"
    ></textarea>

    <br><br>

    <button onclick="salvar()">
        Publicar comentário
    </button>

    <hr>

    <h2>Comentários publicados</h2>

    <div id="lista"></div>

    <script>

        async function salvar() {

            const comentario =
                document.getElementById("comentario").value;

            await fetch("/comentarios", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    comentario
                })
            });

            document.getElementById("comentario").value = "";

            carregar();
        }


        async function carregar() {

            const resposta =
                await fetch("/comentarios");

            const comentarios =
                await resposta.json();

            const lista =
                document.getElementById("lista");

            lista.innerHTML = "";

            comentarios.forEach(comentario => {

                // ==> Trecho vulnerável: O conteúdo do comentário é inserido diretamente
                // no HTML através do innerHTML. Como o comentário é fornecido pelo usuário
                // e fica armazenado, ele pode ser interpretado pelo navegador ao ser carregado.
                // Isso permite que aconteça o XSS Armazenado/Persistente.

                // lista.innerHTML += `
                //     <p>${comentario}</p>
                // `;


                // ==> Trecho corrigido: Utilizando textContent para exibir a entrada
                // do usuário apenas como texto e appendChild para adicionar o elemento à página.

                const paragrafo = document.createElement("p");
                paragrafo.textContent = comentario;
                lista.appendChild(paragrafo);

            });
        }

        carregar();

    </script>

</body>
</html>
